name: Graffiti Contribution Graph

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      target_repo_name:
        description: 'Target Repository (e.g., username/repo)'
        required: true
        default: 'username/graffiti-canvas'

jobs:
  paint-the-town:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write access to tool repo

    steps:
      - name: Checkout Tool Repository
        uses: actions/checkout@v4
        with:
          path: tool_repo

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo_name || secrets.TARGET_REPO_NAME }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target_repo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r tool_repo/requirements.txt

      - name: Configure Git Identity (Tool Repo)
        working-directory: tool_repo
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Configure Git Identity (Target Repo)
        working-directory: target_repo
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Run Graffiti Tool
        working-directory: tool_repo
        env:
          GRAFFITI_INPUT_FILE: graffiti.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the repository owner as the username by default
          USERNAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          echo "Running for user: $USERNAME"

          # Target repo is located at ../target_repo relative to tool_repo
          TARGET_PATH="../target_repo"

          # Run script
          python main.py --username "$USERNAME" --repo "$TARGET_PATH"

      - name: Push changes to Target Repo
        working-directory: target_repo
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "Pushing to $BRANCH_NAME..."
          git push origin HEAD:$BRANCH_NAME

      - name: Push changes to Tool Repo
        working-directory: tool_repo
        run: |
          git push origin HEAD:${{ github.ref }}
