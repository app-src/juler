name: Graffiti Contribution Graph

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  paint-the-town:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write access to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for cleaner graphs, though unnecessary for the script logic

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Run Graffiti Tool
        env:
          GRAFFITI_INPUT_FILE: graffiti.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the repository owner as the username by default
          USERNAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          echo "Running for user: $USERNAME"
          python main.py --username "$USERNAME"

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.ref }}
